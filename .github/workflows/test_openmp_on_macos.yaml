name: Test OpenMP on MacOS

# Temporary workflow to test the OpenMP build on MacOS (PR #596).

on:
  workflow_dispatch:
  push:
    branches:
      - 'omp_on_macos'

jobs:
  "build_and_test_wheel_on_macos":
    name: Build and test wheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: ['macos-15-intel', 'macos-15']

    steps:
      - uses: actions/checkout@v6

      - uses: fortran-lang/setup-fortran@v1
        with:
          compiler: 'gcc'
          version: '13'

      - name: Show compilers
        run: |
          echo "CC=$CC FC=$FC"
          which cc gcc gfortran || true
          cc --version
          ${FC:-gfortran} --version

      - name: Build and test wheel
        uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_BUILD: "cp313-*"
          CIBW_ENVIRONMENT: MACOSX_DEPLOYMENT_TARGET=15.0
          CIBW_BUILD_VERBOSITY: 1
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: "delocate-listdeps {wheel} && delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel} && delocate-listdeps {dest_dir}/*.whl"
          CIBW_TEST_COMMAND: "python {project}/.github/scripts/check_openmp.py && pytest {project}/pytest/"

      - uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.os }}
          path: ./wheelhouse/*.whl
